server {
    listen 80;
    server_name gui.mujiu.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name gui.mujiu.net;

    ssl_certificate /etc/letsencrypt/live/gui.mujiu.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gui.mujiu.net/privkey.pem;

    root /var/www/gui;
    index index.html;

    # HTML 不缓存（部署后立即看到新版）；头像等静态资源缓存 7 天
    location / {
        try_files $uri $uri/ =404;
        expires epoch;
    }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
    }
    location ~* \.(css|js)$ {
        expires 1h;
    }
}
